[package]
name = "mark"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mark: beautiful README images from one URL: banners, badges, typing text, tech icons, GitHub stats cards"
authors = ["SylphxAI"]
repository = "https://github.com/SylphxAI/readme-mark"
publish = false

[[bin]]
name = "mark"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "http2"] }
moka = { version = "0.12", features = ["future"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
