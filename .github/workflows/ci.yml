name: CI

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue on: merge_group trigger wired (PR #11)
# - Concurrency cancels superseded PR/branch tip runs

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: c
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'
              - '!CHANGELOG.md'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'

  # `rust` is skipped (reported as success) only for pull requests that touch
  # nothing but docs and repository metadata. Pushes to main and the merge
  # queue always run it.
  rust:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.code != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        # test-profile only — Platform owns production packaging (build once).
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # Forbidden residual: cargo build --release for ship binary.
      # Platform packages once from sylphx.toml dockerfile (build once, deploy many).

  identifiers:
    name: Identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Non-v7 ids on added lines (owner standards/identifiers.md)
        uses: SylphxAI/.github/.github/actions/identifiers@e4a5ea41cbcc87cd93914f89f0d7c3981c868bf9

  # Added lines send chat through Notify, never a direct chat-API host. The
  # shared action owns the host list and its allow-list; the pin is fixed here
  # so a moved tag cannot change the check. fetch-depth 0 gives the action the
  # base history it diffs against.
  chat-senders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Added lines send chat through Notify
        uses: SylphxAI/.github/.github/actions/chat-senders@5cfd55a41435cca8e4b7caf6506faf04ca08d200
        with:
          mode: fail

  # The org-wide required check name. Skipped lanes pass; a failed or
  # cancelled lane fails. GitHub-hosted only: this is a public repository, so a
  # self-hosted runner would accept fork pull requests' code
  # (scripts/check-owned-runner-profiles.sh).
  ci-ok:
    if: always()
    needs: [changes, rust, identifiers, chat-senders]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@000d98547b68d07c4da1c62f534da85f1bd4001b # main
        with:
          needs: ${{ toJSON(needs) }}
