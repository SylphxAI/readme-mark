name: CI

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue on: merge_group trigger wired (PR #11)
# - Concurrency cancels superseded PR/branch tip runs

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static owned runner profiles
        run: bash scripts/check-owned-runner-profiles.sh
      - name: Source hygiene
        run: python3 scripts/check-source-hygiene.py
      - name: Duplication
        run: python3 scripts/check-duplication.py
      - name: Config parity
        run: python3 scripts/check-config-parity.py
      - name: Module budget
        run: python3 scripts/check-module-budget.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        # test-profile only — Platform owns production packaging (build once).
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # Forbidden residual: cargo build --release for ship binary.
      # Platform packages once from sylphx.toml dockerfile (build once, deploy many).
