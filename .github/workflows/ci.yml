name: CI

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue on: merge_group trigger wired (PR #11)
# - Concurrency cancels superseded PR/branch tip runs

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: c
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'
              - '!CHANGELOG.md'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'

  # `rust` is skipped (reported as success) only for pull requests that touch
  # nothing but docs and repository metadata. Pushes to main and the merge
  # queue always run it.
  rust:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.code != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify static owned runner profiles
        run: bash scripts/check-owned-runner-profiles.sh
      - name: Benchmark workflow status regression (offline)
        run: python3 scripts/check-bench-workflow.py
      - name: Source hygiene
        run: python3 scripts/check-source-hygiene.py
      - name: Duplication
        run: python3 scripts/check-duplication.py
      - name: Config parity
        run: python3 scripts/check-config-parity.py
      - name: Capability evidence guard regressions
        run: python3 -B scripts/test_check_capabilities.py
      - name: Capability evidence and routes
        run: python3 scripts/check-capabilities.py
      - name: Module budget
        run: python3 scripts/check-module-budget.py
      - name: Brand home
        uses: SylphxAI/.github/.github/actions/brand@a6c81b4bcda66bf624f0a68e25e63b3c0ed043eb # shared brand generator
        with:
          render-fit: intrinsic
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        # test-profile only — Platform owns production packaging (build once).
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # Forbidden residual: cargo build --release for ship binary.
      # Platform packages once from sylphx.toml dockerfile (build once, deploy many).

  identifiers:
    name: Identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Non-v7 ids on added lines (owner standards/identifiers.md)
        uses: SylphxAI/.github/.github/actions/identifiers@e4a5ea41cbcc87cd93914f89f0d7c3981c868bf9
