name: Bench

# Render latency in release mode, published to the job summary. Not a merge
# gate: numbers inform the README's performance section.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "Cargo.toml", "Cargo.lock", "tests/render_bench.rs"]
permissions:
  contents: read
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Render latency (release, in-process)
        shell: bash
        run: |
          output=$(mktemp)
          trap 'rm -f "$output"' EXIT
          # Keep diagnostics visible, but publish rows only after cargo succeeds.
          cargo test --release --locked --test render_bench -- --ignored --nocapture --test-threads=1 \
            | tee "$output"
          # No table matches are harmless; grep errors and summary write errors are not.
          { grep '^|' "$output" || test "$?" -eq 1; } | tee -a "$GITHUB_STEP_SUMMARY"
