# Release promotion 2026-09-04: promote 3d7ff482 (incl. b5fd77fc CDN immutable+ETag+304) to production.
# Origin immutable headers are Mark's write; live edge HIT on /api/v1/mark* + /badge/* is Apps (SaaS Custom Hostname + Cache Rule).
version = "1"

[project]
name = "Mark"
default_env = "production"

[build]
strategy = "dockerfile"
dockerfile = "Dockerfile"
context = "."

[deploy]
health_check_path = "/health"
strategy = "rolling"
graceful_shutdown = 15

[[services]]
name = "web"
instance_type = "nano"
port = 8787
# Serverless-first: dens STZ after public /health 200.
path_prefixes = ["/", "/api", "/badge", "/health"]
watch_paths = [
  "src/**",
  "data/**",
  "static/**",
  "templates/**",
  "Cargo.toml",
  "Cargo.lock",
  "Dockerfile",
  "sylphx.toml",
]

[services.health]
mode = "http"
path = "/health"

[env.PUBLIC_BASE_URL]
value = "https://mark.sylphx.com"

# Off by default — banners should not stamp product/company names unless asked.
[env.DEFAULT_CREDIT]
value = "0"

# GitHub cards, stars and CI badges: a read-only public-repo token raises the
# GitHub rate limit from 60 to 5,000 calls an hour. The code falls back to
# anonymous calls when it is empty. Secret set 2026-09-26 (cloud#8849).
[env.GITHUB_TOKEN]
from_secret = "GITHUB_TOKEN"

[env.RUST_LOG]
value = "mark=info,tower_http=info"

[ci]
preview_deploys = true
pr_comment = true
production_branches = ["^main$"]
runner = "standard"
